[build-system]
requires = ["flit_core >= 3.12.0, <4"]
build-backend = "flit_core.buildapi"

[project]
name = "openzl4zarr"
dynamic = ["version"]
dependencies = [
    "openzl",
    "zarr"
]
requires-python = ">=3.10"
authors = [
    {name = "Carlos Horn", email = "mattescarlos@gmail.com"}
]
maintainers = []
description = "OpenZL codec for Zarr"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E"]
keywords = ["zarr", "OpenZL"]
classifiers = [
    "Programming Language :: Python"
]

[project.urls]
homepage = "https://github.com/carloshorn/openzl4zarr"
